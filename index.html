<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lillafüred Kincskereső - Toplista</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #f0f4f8; color: #2d3436; padding: 10px; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 8px 15px rgba(0,0,0,0.1); margin: 15px auto; max-width: 400px; border-left: 5px solid #0984e3; }
        .hidden { display: none; }
        .stats { font-size: 1.1rem; font-weight: bold; color: #d63031; position: sticky; top: 0; background: white; padding: 10px; border-radius: 0 0 15px 15px; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button { background: #00b894; color: white; border: none; padding: 12px 20px; border-radius: 25px; cursor: pointer; font-weight: bold; }
        input { padding: 8px; width: 50px; text-align: center; font-size: 1rem; }
        #leaderboard { text-align: left; list-style: none; padding: 0; }
        #leaderboard li { padding: 5px 0; border-bottom: 1px dotted #ccc; }
        .gold { color: #d4af37; font-weight: bold; }
    </style>
</head>
<body>

    <div class="stats">
        Idő: <span id="timer">00:00</span> | Pont: <span id="score">0</span>/2
    </div>

    <h1>Lillafüred Vadászat2026</h1>
    <button id="startBtn" onclick="initGame()">Játék indítása (Hang engedélyezése)</button>

    <script>
    function initGame() {
      document.getElementById('startBtn').style.display = 'none';
      // Egy néma hang lejátszása az engedélyezéshez
      const utterance = new SpeechSynthesisUtterance("");
      window.speechSynthesis.speak(utterance);
      alert("Helymeghatározás és hang aktív! Indulhat a kaland!");
      }
    </script>

    <p id="status">Várakozás GPS-re...</p>

    <div id="target1" class="card hidden">
        <h3>📍 1. Állomás: József Attila-szobor</h3>
        <p>Hány kőbagoly van a falban?</p>
        <input type="number" id="ans1">
        <button onclick="checkAnswer(1, 3)">OK</button>
    </div>

    <div id="target2" class="card hidden">
        <h3>📍 2. Állomás: Palotaszálló</h3>
        <p>Hány medvefejes kilincset látsz?</p>
        <input type="number" id="ans2">
        <button onclick="checkAnswer(2, 2)">OK</button>
    </div>

    <div id="final" class="card hidden">
        <h2>🎉 Küldetés teljesítve!</h2>
        <p id="finalTime"></p>
        <hr>
        <h4>🏆 Legjobb idők (Top 5):</h4>
        <ul id="leaderboard"></ul>
        <button onclick="location.reload()" style="margin-top:15px">Új játék</button>
    </div>

    <script>
        const targets = [
            { id: 1, lat: 48.1094, lon: 20.6222, radius: 25 },
            { id: 2, lat: 48.1101, lon: 20.6235, radius: 25 }
        ];

        let score = 0, startTime = null, timerInterval = null, totalSeconds = 0;

        function startTimer() {
            if (startTime) return;
            startTime = Date.now();
            timerInterval = setInterval(() => {
                totalSeconds = Math.floor((Date.now() - startTime) / 1000);
                document.getElementById('timer').innerText = formatTime(totalSeconds);
            }, 1000);
        }

        function formatTime(s) {
            return String(Math.floor(s/60)).padStart(2,'0') + ":" + String(s%60).padStart(2,'0');
        }
        // Hanghatások lejátszása (Böngésző beépített hangszintetizátora)
        function playSound(type) {
            const synth = window.speechSynthesis;
            if (type === 'found') {
                const utterance = new SpeechSynthesisUtterance("Állomás elérve!");
                utterance.lang = 'hu-HU';
                synth.speak(utterance);
            } else if (type === 'success') {
                const utterance = new SpeechSynthesisUtterance("Helyes válasz, gratulálok!");
                utterance.lang = 'hu-HU';
                synth.speak(utterance);
            }
        }

// Módosított távolságfigyelő (ebbe illesztjük be a hangot)
if (navigator.geolocation) {
    navigator.geolocation.watchPosition(pos => {
        targets.forEach(t => {
            const dist = getDistance(pos.coords.latitude, pos.coords.longitude, t.lat, t.lon);
            if (dist < t.radius) {
                const card = document.getElementById('target' + t.id);
                if (card.classList.contains('hidden')) {
                    card.classList.remove('hidden');
                    startTimer();
                    playSound('found'); // HANGJELZÉS: Megtaláltad az állomást
                    document.getElementById('status').innerText = "Állomás a közelben!";
                }
            }
        });
    }, null, { enableHighAccuracy: true });
}

// Módosított válaszellenőrző
function checkAnswer(id, correct) {
    if (document.getElementById('ans' + id).value == correct) {
        score++;
        document.getElementById('score').innerText = score;
        document.getElementById('target' + id).classList.add('hidden');
        playSound('success'); // HANGJELZÉS: Jó a válasz
        if (score === targets.length) finishGame();
    } else {
        alert("Próbáld újra!");
    }
}

       

        function finishGame() {
            clearInterval(timerInterval);
            saveResult(totalSeconds);
            showLeaderboard();
            document.getElementById('finalTime').innerText = "Időd: " + formatTime(totalSeconds);
            document.getElementById('final').classList.remove('hidden');
            document.getElementById('status').innerText = "Szép munka!";
        }

        function saveResult(time) {
            let records = JSON.parse(localStorage.getItem('lilla_records') || "[]");
            records.push(time);
            records.sort((a, b) => a - b);
            localStorage.setItem('lilla_records', JSON.stringify(records.slice(0, 5)));
        }

        function showLeaderboard() {
            const list = document.getElementById('leaderboard');
            const records = JSON.parse(localStorage.getItem('lilla_records') || "[]");
            list.innerHTML = records.map((t, i) => 
                `<li class="${i===0?'gold':''}">${i+1}. hely: ${formatTime(t)}</li>`
            ).join('');
        }

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const dLat = (lat2-lat1) * Math.PI/180;
            const dLon = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(pos => {
                targets.forEach(t => {
                    if (getDistance(pos.coords.latitude, pos.coords.longitude, t.lat, t.lon) < t.radius) {
                        document.getElementById('target'+t.id).classList.remove('hidden');
                        startTimer();
                        document.getElementById('status').innerText = "Állomás a közelben!";
                    }
                });
            }, null, { enableHighAccuracy: true });
        }
    </script>
</body>
</html>
