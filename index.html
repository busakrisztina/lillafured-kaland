<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lillafüred Kincskereső - Toplista</title>
    <style>
    body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #f0f4f8; color: #2d3436; padding: 10px; }
    .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 8px 15px rgba(0,0,0,0.1); margin: 15px auto; max-width: 400px; border-left: 5px solid #0984e3; }
    .hidden { display: none; }
    .stats { font-size: 1.1rem; font-weight: bold; color: #d63031; position: sticky; top: 0; background: white; padding: 10px; border-radius: 0 0 15px 15px; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    button { background: #00b894; color: white; border: none; padding: 12px 20px; border-radius: 25px; cursor: pointer; font-weight: bold; }
    input { padding: 8px; width: 50px; text-align: center; font-size: 1rem; }
    #leaderboard { text-align: left; list-style: none; padding: 0; }
    #leaderboard li { padding: 5px 0; border-bottom: 1px dotted #ccc; }
    .gold { color: #d4af37; font-weight: bold; }
</style>
</head>
<body>

    <div class="stats">
        Idő: <span id="timer">00:00</span> | Pont: <span id="score">0</span>/2
    </div>

    <h1>Lillafüred Vadászat</h1>
    <button id="startBtn" onclick="initGame()">Játék indítása (Hang és GPS engedélyezése)</button>
    <p id="status">Várakozás indításra...</p>

    <div id="target1" class="card hidden">
        <h3>📍 1. Állomás: József Attila-szobor</h3>
        <p>Hány kőbagoly van a falban?</p>
        <input type="number" id="ans1">
        <button onclick="checkAnswer(1, 3)">OK</button>
    </div>

    <div id="target2" class="card hidden">
        <h3>📍 2. Állomás: Palotaszálló</h3>
        <p>Hány medvefejes kilincset látsz?</p>
        <input type="number" id="ans2">
        <button onclick="checkAnswer(2, 2)">OK</button>
    </div>

    <div id="final" class="card hidden">
        <h2>🎉 Küldetés teljesítve!</h2>
        <p id="finalTime"></p>
        <hr>
        <h4>🏆 Legjobb idők (Top 5):</h4>
        <ul id="leaderboard"></ul>
        <button onclick="location.reload()" style="margin-top:15px">Új játék</button>
    </div>

    <!-- Cseréld le a teljes <script> részt erre a finomított változatra -->
    <script>
         const targets = [
        { id: 1, lat: 48.39704, lon: 21.65415, radius: 100 }, // Sátoraljaújhelyi tesztpont
        { id: 2, lat: 48.1101, lon: 20.6235, radius: 25 }
        ];

        let score = 0, startTime = null, timerInterval = null, totalSeconds = 0;

    // iOS SPECIFIKUS: A hangokat egy láthatatlan kattintással kell élesíteni
    function initGame() {
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('status').innerText = "GPS keresése...";

        // iOS HANG FIX: Az Apple csak akkor engedi a hangot, ha egy user-esemény (click) alatt hívjuk meg először
        const synth = window.speechSynthesis;
        const utterance = new SpeechSynthesisUtterance("Sikeres indítás");
        utterance.lang = 'hu-HU';
        utterance.volume = 1.0;
        synth.speak(utterance);

        // GPS indítása
        if (navigator.geolocation) {
            // iOS SPECIFIKUS: Különösen fontos a 'high accuracy' és a timeout beállítása
            navigator.geolocation.watchPosition(
                pos => {
                    const userLat = pos.coords.latitude;
                    const userLon = pos.coords.longitude;
                    const accuracy = Math.round(pos.coords.accuracy);

                // Kiírjuk a státuszt, a pontosságot ÉS a pontos koordinátákat is
                document.getElementById('status').innerHTML = `
                <span style="color: #00b894;">GPS OK!</span><br>
                <small>Pontosság: ${accuracy} méter</small><br>
                <small style="color: #636e72;">Pozíciód: ${userLat.toFixed(5)}, ${userLon.toFixed(5)}</small>
                `;
                
                targets.forEach(t => {
                    const dist = getDistance(userLat, userLon, t.lat, t.lon);
                    if (dist < t.radius) {
                        const card = document.getElementById('target' + t.id);
                        if (card.classList.contains('hidden')) {
                            card.classList.remove('hidden');
                            startTimer();
                            
                            if (navigator.vibrate) navigator.vibrate(200); 
                            
                            playSound('found');
                            document.getElementById('status').innerHTML += "<br><b>Állomás elérve!</b>";
                        }
                    }
                });
            },
            err => {
                let msg = "Hiba: ";
                if (err.code === 1) msg += "Engedélyezd a GPS-t!";
                else if (err.code === 2) msg += "Nincs jel!";
                else msg += err.message;
                document.getElementById('status').innerText = msg;
            },
            { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );

        }
    }

    function playSound(type) {
        // iOS FIX: Mindig ellenőrizzük, hogy nincs-e "beragadva" a hangszintetizátor
        window.speechSynthesis.cancel(); 
        const text = (type === 'found') ? "Állomás elérve!" : "Helyes válasz!";
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'hu-HU';
        window.speechSynthesis.speak(utterance);
    }

    // ... a többi függvény (getDistance, checkAnswer, stb.) változatlan marad ...
    </script>

</body>
</html>
